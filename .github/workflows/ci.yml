name: CI - HOS-LS Security Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest mypy hypothesis

      # --- 分级 lint 门禁（主题 B / Req 1.5, 2.4）---
      # Tier 1 blocking：CI blocking 选择器对全仓库 0 容忍（语法级硬错误）。
      - name: Lint with flake8 (fatal errors - blocking)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Tier 2 blocking：清零后的目录 0 容忍（主题 A 已清零并锁定）。
      # 不加 --extend-ignore，本地与 CI 同口径（.flake8 已含 tests/* E402 豁免）。
      - name: Lint with flake8 (ecatsl + tests - blocking)
        run: |
          flake8 src/ecatsl tests --count

      # Tier 3 informational：src 其余目录仅输出计数，失败不阻塞 CI。
      # 原因：主题 A 仅清零 src/ecatsl 与 tests，其余历史目录债务未纳入本循环。
      - name: Lint with flake8 (rest of src - informational, count only)
        run: |
          flake8 src --count --statistics || true

      # mypy 白名单驱动（Req 1.2/2.4）：pyproject.toml per-module overrides，
      # 白名单外 0 项即 0 退出；移除旧 `|| echo` 吞错语义。
      # python_version 3.12：3.10/3.11 被 numpy stub PEP 695 type 语句阻塞（任务 1.2）。
      - name: Type check with mypy (whitelist-driven, blocking)
        run: |
          mypy src

      # --- 真实执行测试（主题 B / Req 2.1-2.3）---
      # 快速门禁：ECATSL 单元/集成 + core 单元（blocking，失败即红）。
      - name: Run focused tests (blocking)
        run: |
          pytest tests/unit/ecatsl tests/integration/ecatsl tests/unit/core -q

      - name: Test with pytest
        run: |
          pytest --collect-only || echo "No tests found"
        continue-on-error: true

  full-tests:
    # 独立全量 job：非 blocking check，失败在 PR 可见但不阻塞合并（Req 2.1）。
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # 不启用 pip cache：全量依赖含 torch 等重包，cache 键命中率低且拖慢还原。

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest hypothesis

      - name: Run full test suite (informational)
        run: |
          pytest tests -q --no-header

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: |
          pip install bandit safety
      - name: Run bandit security scan
        run: |
          bandit -r . -f txt || echo "Security scan completed"
        continue-on-error: true
