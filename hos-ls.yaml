agent:
  dynamic_selection: true
  skip_context_if_sufficient: true
ai:
  allow_fallback: false
  api_key: ''
  base_url: https://api.deepinfra.com/v1
  deepinfra:
    api_key: ''
    base_url: https://api.deepinfra.com/v1/openai
    enabled: true
    flex_mode: true
    model: mistralai/Mixtral-8x22B-Instruct-v0.1
  deepseek:
    api_key: ''
    base_url: https://api.deepseek.com
    enabled: true
    model: deepseek-v4-flash
  enabled: true
  max_tokens: 4096
  model: deepseek-ai/DeepSeek-V4-Flash
  modules:
    nvd:
      enabled: true
      model: deepseek-v4-flash
      provider: deepseek
    pure_ai:
      enabled: true
      model: deepseek-ai/DeepSeek-V4-Flash
      provider: openai
    rag:
      embedding_model: Qwen/Qwen3-Embedding-0.6B
      enabled: true
      provider: deepseek
      rerank_model: BAAI/bge-reranker-large
  provider: openai
  temperature: 0.1
  tiered_architecture:
    enabled: false
    first_tier:
      model: deepseek-v4-flash
      provider: deepseek
      purpose: 快速预扫描，识别可疑文件
    risk_threshold: 0.5
    second_tier:
      model: deepseek-v4-flash
      provider: deepseek
      purpose: 深度分析危险路径
  timeout: 60
debug: false
i18n:
  language: zh
log:
  file: ''
  format: text
  level: info
pentest:
  ai_helper:
    analyze_result: true
    enabled: true
    generate_poc: true
    model: deepseek-v4-flash
    provider: deepseek
  enabled: true
  execution:
    parallel: 3
    proxy: ''
    timeout: 300
  fallback:
    auto_fallback: true
    log_history: true
    notify_user: true
    show_available: true
  nvd_db_path: All Vulnerabilities/sql_data/nvd_vulnerability.db
  nvd_lookup:
    enabled: true
    fuzzy_match: true
    max_results: 50
  tools:
    nuclei:
      auto_install: true
      enabled: true
      template_dir: nuclei-templates
    sqlmap:
      auto_install: true
      enabled: true
      path: sqlmap
plugins:
  enabled: true
  functional:
  - config:
      patterns:
      - '*.py'
      - '*.js'
      - '*.ts'
    enabled: true
    name: custom-scanner
    path: ./src/plugins/builtin/functional/custom_scanner_plugin.py
  mcp:
  - config:
      auto_install: true
      risk_level: 2
      timeout: 600
    enabled: true
    name: sqlmap
    path: ./src/plugins/builtin/mcp/sqlmap_plugin.py
  - config:
      auto_install: true
      template_dir: ./nuclei-templates
      timeout: 600
    enabled: true
    name: nuclei
    path: ./src/plugins/builtin/mcp/nuclei_plugin.py
  - config:
      api_mode: true
      auto_install: true
      timeout: 900
    enabled: true
    name: zap
    path: ./src/plugins/builtin/mcp/zap_plugin.py
  plugin_dirs:
  - ./src/plugins/builtin
  - ./plugins
  - ~/.hos-ls/plugins
  skills:
  - config:
      languages:
      - python
      - javascript
      - java
      - typescript
      - go
      - rust
    enabled: true
    name: code-analysis
    path: ./src/plugins/builtin/skills/code_analysis_skill.py
  - config:
      formats:
      - html
      - json
      - markdown
    enabled: true
    name: report-generation
    path: ./src/plugins/builtin/skills/report_generation_skill.py
priority:
  enabled: true
  thresholds:
    critical: 9.0
    high: 7.0
    medium: 4.0
  weights:
    cvss: 0.4
    exploitability: 0.35
    reachability: 0.25
quiet: false
remote:
  connection_timeout: 30
  enabled: false
  read_timeout: 60
  retry_times: 3
  serial_baudrate: 115200
  ssh_port: 22
report:
  format: html
  include_fix_suggestions: true
  include_snippets: true
  output: ''
rules:
  custom_rules: []
  exclude_paths: []
  ruleset: default
sandbox:
  cve_database:
    auto_match: true
    db_path: All Vulnerabilities/sql_data/vd_vulnerability.db
    enabled: true
    json_path: All Vulnerabilities/temp_zip/PoC-in-GitHub-master
  enabled: false
  languages:
  - python
  - javascript
  - java
  - typescript
  - go
  timeout: 30
scan:
  cache_enabled: true
  incremental: true
  max_workers: 4
tools:
  enabled: true
  gitleaks:
    config: ''
    enabled: true
    no-git: true
  semgrep:
    config: auto
    enabled: true
    timeout: 30
  syft:
    enabled: true
    format: json
    package_managers:
    - auto
  tool_chain:
  - semgrep
  - trivy
  - gitleaks
  - code_vuln_scanner
  trivy:
    enabled: true
    severity: HIGH,CRITICAL
    timeout: 300
validation:
  auto_validate_high: true
  auto_validate_medium: false
  enabled: true
  line_number_tolerance: 5
  min_confidence_threshold: 0.7
verbose: false
