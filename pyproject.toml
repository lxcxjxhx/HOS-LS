[tool.poetry]
name = "hos-ls"
version = "0.3.3.17"
description = "HOS-LS: AI生成代码安全扫描工具 - 基于LangGraph的Multi-Agent架构，支持语义搜索、两阶段扫描、CVE集成、攻击链分析和断点续传"
authors = ["HOS Team <team@hos-ls.com>"]
readme = "README.md"
license = "AGPL-3.0-only"
homepage = "https://github.com/lxcxjxhx/HOS-LS"
repository = "https://github.com/lxcxjxhx/HOS-LS"
keywords = ["security", "ai", "code-scanning", "vulnerability-detection", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.poetry.dependencies]
python = "^3.8"
# Core dependencies
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
click = "^8.1.0"
rich = "^13.0.0"
tqdm = "^4.66.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"

# AI/LLM dependencies
anthropic = "^0.39.0"
openai = "^1.0.0"
langchain = "^0.1.0"
langchain-openai = "^0.1.0"
langgraph = "^1.0.0"
dspy = "^3.1.3"
langsmith = "^0.1.0"

# Code analysis dependencies
tree-sitter = "^0.20.0"
tree-sitter-python = "^0.20.0"
tree-sitter-javascript = "^0.20.0"
tree-sitter-typescript = "^0.20.0"
tree-sitter-java = "^0.20.0"
tree-sitter-cpp = "^0.20.0"
libcst = "^1.0.0"

# Graph and network analysis
networkx = "^3.0.0"

# Vector storage
chromadb = "^1.0.0"
faiss-cpu = "^1.7.4"

# Git operations
gitpython = "^3.1.0"

# HTTP clients
httpx = "^0.25.0"
aiohttp = "^3.9.0"
aiofiles = "^23.2.0"

# Database
aiosqlite = "^0.19.0"
diskcache = "^5.6.0"
neo4j = "^5.15.0"
neo4j-graphrag = "^1.0.0"

# Data processing
numpy = "^1.24.0"
scikit-learn = "^1.3.0"

# Local embedding/model-training packages (optional; not required by the scanner core)
sentence-transformers = { version = "^2.2.0", optional = true }
torch = { version = "^2.0.0", optional = true }

# Report generation
jinja2 = "^3.1.0"
markdown = "^3.5.0"
python-docx = "^0.8.11"

# GitHub integration
pygithub = "^1.59.0"
requests = "^2.31.0"

# Web scraping and additional utilities
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"
ratelimit = "^2.2.1"

# Local model support (optional, for advanced features)
transformers = { version = "^4.30.0", optional = true }
unsloth = { version = "^2024.0.0", optional = true }

# Testing
pytest = { version = "^7.4.0", optional = true }
pytest-asyncio = { version = "^0.21.0", optional = true }
pytest-cov = { version = "^4.1.0", optional = true }
hypothesis = { version = "6.112.6", optional = true }

# Development
black = { version = "^23.0.0", optional = true }
isort = { version = "^5.12.0", optional = true }
flake8 = { version = "^6.0.0", optional = true }
mypy = { version = "^1.5.0", optional = true }

[tool.poetry.extras]
local = ["transformers", "sentence-transformers", "torch"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "hypothesis", "black", "isort", "flake8", "mypy"]
all = ["transformers", "sentence-transformers", "torch", "pytest", "pytest-asyncio", "pytest-cov", "hypothesis", "black", "isort", "flake8", "mypy"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
hypothesis = "6.112.6"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pre-commit = "^3.5.0"

[[tool.poetry.packages]]
include = "src"

[tool.poetry.scripts]
hos-ls = "src.cli.main:main"
hosls = "src.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
# 检查口径 3.12:与部署解释器(3.13)同代。3.10/3.11 下新版 numpy stub 的
# `type` 语句(PEP 695,需 3.12+)会使 mypy 直接中止解析,无法产出检查结果。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    # 跨平台路径分隔符([\\/]),Windows 反斜杠路径下也能命中
    'src[\\/]analyzers[\\/]verification[\\/]multi_lang_mocks\\.py$',
]

# =============================================================================
# mypy 遗留错误白名单(任务 ecatsl-1.2,Spec: ecatsl-operationalization-and-bench-integration)
# - 口径:python_version=3.12,`mypy src` 基线 258 项/107 文件(3.10 口径因
#   numpy stub PEP 695 语法无法完成检查,"290 项"为旧口径历史记录)。
# - 其中 src/ecatsl 29 项已在本任务全部修复;其余 229 项按"模块+错误码"收敛
#   到下方 per-module 白名单,每条记录错误码与原因。
# - 约定:白名单外必须 0 项;新增代码不得进白名单;白名单模块出现清单外
#   错误码会直接失败,新错误码须修复而非扩白名单。
# =============================================================================

# --- LLM 供应商 SDK 适配:第三方 SDK 无 stub,动态响应字段与可选链密集 ---
[[tool.mypy.overrides]] # reason: vendor SDK 弱类型适配层,修复收益低、回归风险高
module = ["src.ai.providers.*"]
disable_error_code = [
    "dict-item", "no-any-return", "return-value", "union-attr", "unreachable",
]

# --- Pure-AI 多智能体流水线:历史遗留,动态属性/不可达分支/Any 传播密集 ---
[[tool.mypy.overrides]] # reason: 历史流水线代码,动态结构多,整体重写超出本循环范围
module = ["src.ai.pure_ai.*", "src.ai.models"]
disable_error_code = [
    "arg-type", "assignment", "attr-defined", "call-arg", "has-type", "index",
    "misc", "no-any-return", "operator", "return-value", "unreachable",
    "unused-ignore", "var-annotated",
]

# --- 规则引擎:数据驱动规则表,字段来源动态 ---
[[tool.mypy.overrides]] # reason: 规则为数据驱动声明式结构,mypy 无法静态收敛字段类型
module = ["src.rules.builtin.*"]
disable_error_code = ["unreachable", "var-annotated"]

[[tool.mypy.overrides]] # reason: 规则加载器对规则表的动态字段访问
module = ["src.rules.loader"]
disable_error_code = ["arg-type", "call-arg"]

# --- 插件系统:宿主动态注册,回调签名不精确 ---
[[tool.mypy.overrides]] # reason: 插件宿主回调签名宽泛,动态注册结构
module = ["src.plugins.builtin.*"]
disable_error_code = [
    "arg-type", "assignment", "attr-defined", "var-annotated",
]

[[tool.mypy.overrides]] # reason: 插件管理器/注册表动态装配
module = ["src.plugins.manager", "src.plugins.registry"]
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-arg"]

# --- NVD 数据管道:ETL 脚本式代码,行式转换 ---
[[tool.mypy.overrides]] # reason: ETL 行式转换脚本,Any 传播自上游数据源
module = ["src.nvd.etl.*"]
disable_error_code = ["arg-type", "attr-defined", "var-annotated"]

[[tool.mypy.overrides]] # reason: NVD 数据库层动态行对象
module = ["src.nvd.db.*"]
disable_error_code = ["arg-type", "assignment", "no-any-return", "union-attr"]

[[tool.mypy.overrides]] # reason: NVD CLI/下载/同步辅助脚本
module = ["src.nvd.cli", "src.nvd.downloader"]
disable_error_code = ["assignment", "no-any-return"]

[[tool.mypy.overrides]] # reason: 抽象基类签名与实现不匹配(abstract)
module = ["src.nvd.sync"]
disable_error_code = ["abstract"]

# --- CLI 层(注意:新增 ecatsl_cmd 等不得加入白名单) ---
[[tool.mypy.overrides]] # reason: 交互式 panel 的 Textual/Rich 动态组件
module = ["src.cli.panel.*"]
disable_error_code = ["assignment", "no-any-return", "return-value", "var-annotated"]

[[tool.mypy.overrides]] # reason: 历史命令对生成器/报告模块的动态属性访问
module = [
    "src.cli.commands.import_scan_commands",
    "src.cli.commands.nvd_commands",
    "src.cli.commands.scan_cmd",
]
disable_error_code = ["attr-defined", "misc"]

[[tool.mypy.overrides]] # reason: 主入口的动态命令装配与子解释器属性
module = ["src.cli.main"]
disable_error_code = ["attr-defined", "has-type", "return-value", "union-attr"]

# --- verification 多语言转换器 ---
# multi_lang_mocks 被 exclude 排除、经 virtual_runtime import 跟入时,
# mypy 1.20 对"被跟入的 excluded 模块"不应用 disable_error_code,
# 必须用 follow_imports=skip(或对被跟入模块 ignore_errors)收敛 —— 实测确认。
[[tool.mypy.overrides]] # reason: AST 转译引擎跨语言节点映射,动态分发结构;excluded+被跟入模块用 follow_imports=skip 屏蔽
module = [
    "src.analyzers.verification.multi_lang_mocks",
]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]] # reason: 其余 verification 模块的动态分发结构
module = [
    "src.analyzers.verification.*",
]
disable_error_code = [
    "arg-type", "assignment", "call-arg", "call-overload", "exit-return",
    "no-any-return", "operator", "union-attr", "unused-ignore",
]

[[tool.mypy.overrides]] # reason: 分级流水线历史装配代码
module = ["src.analyzers.verification_pipeline"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]] # reason: ecatsl 编译输入校验的运行时防御分支(Mapping 契约下对 mypy 不可达)
module = ["src.ecatsl.compiler"]
disable_error_code = ["unreachable"]

# --- 其余遗留单文件(逐条列出,错误码精确) ---
[[tool.mypy.overrides]] # reason: 成本/分支助手,返回 Any 传播
module = ["src.ai.balance"]
disable_error_code = ["assignment", "return-value"]

[[tool.mypy.overrides]] # reason: 威胁情报数据源字段动态
module = ["src.analysis.threat_intelligence"]
disable_error_code = ["arg-type"]

# reason: 旧分析器群,返回值经 Any 传播(各文件 1 项 no-any-return)
[[tool.mypy.overrides]]
module = [
    "src.analyzers.ai_assisted_analyzer",
    "src.analyzers.ast_analyzer",
    "src.analyzers.context_analyzer",
    "src.analyzers.deep_verifier",
    "src.analyzers.sast_prefilter",
]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]] # reason: 配置/端口扫描器推断注解不精确
module = ["src.analyzers.config_scanner", "src.analyzers.port_scanner"]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]] # reason: 分级流水线回调签名宽
module = ["src.analyzers.tiered_analysis_pipeline"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]] # reason: 统一校验器聚合字典动态赋值
module = ["src.analyzers.unified_finding_validator"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]] # reason: 证据链模块对上游对象的动态属性访问
module = ["src.assessment.evidence_chain"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]] # reason: 缓存管理器条目返回 Any
module = ["src.cache.manager"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]] # reason: 文件分析入口,历史回调与 Any 传播
module = ["src.core.analyze_files"]
disable_error_code = ["arg-type", "misc", "unreachable", "unused-ignore"]

[[tool.mypy.overrides]] # reason: chat 子包,动态 pipeline 装配
module = ["src.core.chat.*"]
disable_error_code = ["arg-type", "attr-defined", "no-any-return"]

[[tool.mypy.overrides]] # reason: 核心引擎遗留字典赋值与不可达分支
module = ["src.core.engine"]
disable_error_code = ["assignment", "unreachable"]

[[tool.mypy.overrides]] # reason: 融合代理聚合容器注解缺失
module = ["src.core.fusion_agent"]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]] # reason: langgraph 流程对动态图对象的属性访问
module = ["src.core.langgraph_flow"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]] # reason: 注册表条目返回 Any
module = ["src.core.registry"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]] # reason: 预加载器动态批处理结构
module = ["src.core.related_file_preloader"]
disable_error_code = ["misc", "no-any-return"]

[[tool.mypy.overrides]] # reason: 远程扫描回调签名宽
module = ["src.core.remote_scanner"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]] # reason: 结果聚合器动态容器
module = ["src.core.result_aggregator"]
disable_error_code = ["arg-type", "assignment", "unreachable"]

[[tool.mypy.overrides]] # reason: 扫描运行时对动态子模块属性访问
module = ["src.core.scan_runner"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]] # reason: 调度器动态批次结构
module = ["src.core.scan_scheduler"]
disable_error_code = ["attr-defined", "misc"]

[[tool.mypy.overrides]] # reason: 扫描状态容器动态赋值
module = ["src.core.scan_state"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]] # reason: 扫描器返回 Any 传播
module = ["src.core.scanner"]
disable_error_code = ["misc", "no-any-return"]

[[tool.mypy.overrides]] # reason: DB 模型行对象动态字段
module = ["src.db.models"]
disable_error_code = ["assignment"]

# reason: 集成层遗留模块(预载/导入/远程/模板/搜索/NVD 拉取)
[[tool.mypy.overrides]]
module = ["src.integration.data_preloader", "src.integration.nvd_feed_fetcher"]
disable_error_code = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["src.integration.import_manager", "src.integration.remote"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]] # reason: 模板渲染调用参数动态
module = ["src.integration.templates"]
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]] # reason: 网页搜索结果结构动态
module = ["src.integration.web_search"]
disable_error_code = ["assignment", "unreachable"]

[[tool.mypy.overrides]] # reason: 监控/优化工具的返回 Any 与动态注解
module = ["src.utils.memory_monitor", "src.utils.parallel_optimizer"]
disable_error_code = ["assignment", "no-any-return", "return-value"]

[[tool.mypy.overrides]] # reason: 性能监控动态容器
module = ["src.utils.performance_monitor"]
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]] # reason: 优先级引擎不可达分支
module = ["src.utils.priority_engine"]
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]] # reason: 公告/数据库客户端行对象动态字段
module = ["src.vulnerability.github_advisory_client", "src.vulnerability.nvd_database"]
disable_error_code = ["assignment"]

# --- 第三方库:无 stub,跳过缺失导入 ---
[[tool.mypy.overrides]] # reason: 第三方库无类型 stub
module = ["yaml", "requests", "requests.*", "paramiko", "aiofiles"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["fixtures", ".venv", "venv", "build", "dist", ".git"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
